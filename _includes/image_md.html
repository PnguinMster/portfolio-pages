<figure class="blog-article-picture">
  <picture>
    <source srcset="{{ include.src | replace: '.jpg', '.webp' | relative_url }}" type="image/webp" />
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" />
  </picture>
  <figcaption class="small-text">{{ include.fig }}</figcaption>
</figure>
